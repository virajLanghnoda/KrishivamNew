          var grow = inout(span(v, .3, .8));
          dash(stem, grow);
          plant.style.transformOrigin = '120px 250px';
          plant.style.transform = 'rotate(' + (Math.sin(t * 1.2) * 1.1 * alive).toFixed(3) + 'deg)';
          for (var j = 0; j < leaves.length; j++) {
            var L = leaves[j], k = ease(span(grow, L.at - .02, L.at + .2));
            var rot = L.side * (L.a - (1 - k) * 48) + Math.sin(t * 1.9 + j * 1.4) * 1.8 * alive;
            L.g.style.transform = 'translate(' + L.x + 'px,' + L.y + 'px) rotate(' + rot.toFixed(2) + 'deg) scale(' + L.side + ',1)';
            dash(L.edge, k); dash(L.vein, ease(span(k, .3, 1)));
            L.wash.setAttribute('opacity', (span(k, .55, 1) * .55).toFixed(3));
          }
          // Harvest: the ear forms, then ripens from green ink to gold.
          var head = span(v, .72, .9), ripe = ease(span(v, .86, 1));
          for (var g2 = 0; g2 < grains.length; g2++) {
            var G = grains[g2], gk = ease(span(head, G.at * .6, G.at * .6 + .4));
            dash(G.line, gk); dash(G.awn, ease(span(head, G.at * .6 + .2, G.at * .6 + .6)));
            G.fill.setAttribute('opacity', (ripe * .95).toFixed(3));
          }
          dash(tipLine, ease(span(head, .7, 1))); tipFill.setAttribute('opacity', (ripe * .95).toFixed(3));
          ear.style.transformOrigin = '120px 68px';
          ear.style.transform = 'rotate(' + (Math.sin(t * 1.5) * 2.2 * alive).toFixed(2) + 'deg)';
          sun.style.opacity = (ease(span(v, .3, 1)) * (0.85 + Math.sin(t * 1.4) * .15 * alive)).toFixed(3);

          var n = Math.round(v * 100);
          num.textContent = n < 10 ? '0' + n : String(n);
          var now = 0;
          for (var s = 0; s < steps.length; s++) {
            var S = steps[s], fillv = span(v, S.band[0], S.band[1]);
            S.bar.style.transform = 'scaleX(' + fillv.toFixed(3) + ')';
            if (v >= S.band[0]) now = s;
          }
          if (now !== shownStep) {
            for (var s2 = 0; s2 < steps.length; s2++) {
              steps[s2].el.className = 'kl-step' + (s2 <= now ? ' on' : '') + (s2 === now ? ' now' : '');
            }
            shownStep = now;
          }
        }

        var last = start;
        function tick(now) {
          if (gone) return;
          var t = (now - start) / 1000, dt = Math.min(.3, (now - last) / 1000), age = now - start;
          last = now;
          // While waiting, creep toward 90% so a slow connection still sees growth.
          var creep = .9 - (.9 - .1) * Math.exp(-t / 5);
          var goal = ready && age > MIN ? 1 : Math.min(.94, Math.max(target, creep));
          // Never grow faster than the minimum time allows, so the plant always gets
          // its full 2.5 s even when everything is already cached.
          if (goal < 1) goal = Math.min(goal, age / MIN);
          // Ease by elapsed time, not per frame, so a slow device isn't held back too.
          p += (goal - p) * (reduce ? 1 : 1 - Math.exp(-dt / (goal === 1 ? .2 : .22)));
          draw(p, t);
          if (goal === 1 && p > .997) return lift();
          requestAnimationFrame(tick);
        }

        function lift() {
          gone = true;
          draw(1, (performance.now() - start) / 1000);
          // Fold the screen into the soil line, which is where the page opens from.
          var art = q('.kl-art').getBoundingClientRect();
          var hy = Math.round(art.top + art.height * (250 / 340));
          setTimeout(function () {
            el.classList.add('kl-out');
            el.style.clipPath = 'inset(' + hy + 'px 0 ' + (window.innerHeight - hy) + 'px 0)';
            document.documentElement.classList.remove('kl-lock');
            window.__klIsDone = true;
            if (performance.mark) performance.mark('kl:done');
            window.dispatchEvent(new Event('kl:done'));
            setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 1050);
          }, reduce ? 0 : 520);
        }

        draw(0, 0);
        requestAnimationFrame(tick);
      })();
    </script>
