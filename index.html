    <script>
      (function () {

        var stem = q('.kl-stem'), plant = q('.kl-plant'), dawn = q('.kl-dawn'), sun = q('.kl-sunrise'), warmth = q('.kl-warmth'), stars = q('.kl-stars');
        var halfL = q('.kl-half-l'), halfR = q('.kl-half-r'), bar = q('.kl-bar i'), pct = q('.kl-pct'), stageEl = q('.kl-stage');
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Scattered the same way every time.
        var seed = 11, rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
        var span = function (v, a, b) { return Math.max(0, Math.min(1, (v - a) / (b - a))); };
        var ease = function (t) { return 1 - Math.pow(1 - t, 3); };
        var lerp = function (a, b, t) { return a + (b - a) * t; };

        // Furrows run from the horizon toward the viewer; ridges catch the light.
        var furrows = q('.kl-furrows'), VX = 160, HY = 177;
        var row = function (d, t) { return [lerp(VX + d * 13, VX + d * 118, t), lerp(HY, 262, t)]; };
        for (var d = -6.5; d <= 6.5; d += 1) {
          var a = row(d, 0), b = row(d, 1);

          make('path', { d: 'M' + (a[0] + 1) + ' ' + a[1] + ' L' + (b[0] + 4) + ' ' + b[1], stroke: '#a07a52', 'stroke-opacity': '.4', 'stroke-width': '.8' }, furrows);
        }
        var grains = q('.kl-grains');
        for (var g = 0; g < 70; g++) {
          var gy = 182 + Math.pow(rnd(), 0.8) * 76, depth = (gy - HY) / 85;
          make('circle', { cx: (rnd() * 320).toFixed(1), cy: gy.toFixed(1), r: (0.3 + depth * 1.4 * rnd()).toFixed(2), opacity: (0.08 + rnd() * 0.22).toFixed(2) }, grains);
        }

        // A grass blade drawn pointing right from its joint, arching up then
        // drooping at the tip. Mirrored for the left side.
        var blade = function (len, lift, droop, w) {
          return 'M0 0 C' + len * 0.3 + ' ' + -lift + ' ' + len * 0.72 + ' ' + -lift * 0.95 + ' ' + len + ' ' + droop +
            ' C' + len * 0.7 + ' ' + -lift * 0.5 + ' ' + len * 0.32 + ' ' + -lift * 0.38 + ' 0 ' + w + 'Z';
        };
        var rib = function (len, lift, droop) { return 'M0 1 C' + len * 0.3 + ' ' + -lift * 0.72 + ' ' + len * 0.72 + ' ' + -lift * 0.72 + ' ' + len + ' ' + droop; };

        // Sprouts along the furrows, near rows bigger. Each wakes at its own moment.
        var sprouts = [], sproutHost = q('.kl-sprouts'), spots = [];
        for (var sd = -5; sd <= 5; sd++) {
          if (sd === 0) continue;
          for (var st = 0.08; st < 1; st += 0.22) {
            var tt = st + (rnd() - 0.5) * 0.08, at = row(sd + 0.5, tt);
            if (at[0] < 6 || at[0] > 314 || (Math.abs(at[0] - 160) < 26 && at[1] > 210)) continue;
            spots.push({ x: at[0], y: at[1], s: 0.5 + tt * 1.4 });
          }
        }
        spots.sort(function (m, n) { return m.y - n.y; });
        for (var si = 0; si < spots.length; si++) {
          var sp = spots[si], grp = make('g', {}, sproutHost), parts = [];

          }

        // Main plant blades, low to high. `at` is how far up the stem the joint sits.

          { at: .16, len: 62, lift: 18, droop: 18, a: -2, side: -1, fill: 'B' },
          { at: .32, len: 66, lift: 20, droop: 13, a: -12, side: 1, fill: 'B' },
          { at: .45, len: 60, lift: 18, droop: 10, a: -15, side: -1, fill: 'A' },
          { at: .6, len: 50, lift: 16, droop: 6, a: -24, side: 1, fill: 'A' },
          { at: .73, len: 40, lift: 12, droop: 3, a: -32, side: -1, fill: 'B' },
          { at: .85, len: 28, lift: 9, droop: 0, a: -44, side: 1, fill: 'A' },

        var host = q('.kl-blades');
        for (var i = 0; i < blades.length; i++) {
          var B = blades[i], grpB = make('g', {}, host);
          make('path', { d: blade(B.len, B.lift, B.droop, 4.2), fill: 'url(#kl-blade' + B.fill + ')' }, grpB);
          make('path', { d: rib(B.len, B.lift, B.droop), fill: 'none', stroke: '#e8f3c8', 'stroke-opacity': '.3', 'stroke-width': '.7', 'stroke-linecap': 'round' }, grpB);
          B.y = 228 - B.at * 146;
          B.x = 160 + Math.sin(B.at * 6) * 1.6;
          B.el = grpB;
        }

        // The ear: paired grains climbing the stem tip, with long awns.
        var ear = q('.kl-ear'), earGreen = make('g', { fill: '#9fcf5a' }, ear), earGold = make('g', { fill: 'url(#kl-gold)', opacity: '0' }, ear), awns = make('g', { stroke: '#d9c27a', 'stroke-width': '.6', 'stroke-linecap': 'round', fill: 'none', opacity: '0' }, ear);
        for (var e = 0; e < 7; e++) {
          var ey = 84 - e * 5.6, ew = 3.6 - e * 0.25;
          for (var es = -1; es <= 1; es += 2) {
            var tr = 'translate(' + (160 + es * 2.6) + ' ' + ey + ') rotate(' + es * 24 + ')';
            make('ellipse', { rx: ew.toFixed(2), ry: (ew * 1.75).toFixed(2), transform: tr }, earGreen);
            make('ellipse', { rx: ew.toFixed(2), ry: (ew * 1.75).toFixed(2), transform: tr }, earGold);
            make('path', { d: 'M' + (160 + es * 3) + ' ' + (ey - 3) + ' L' + (160 + es * (10 + e)) + ' ' + (ey - 22 - e * 1.5) }, awns);

        }
        make('ellipse', { cx: 160, cy: 44, rx: 2.4, ry: 4.4 }, earGreen);
        make('ellipse', { cx: 160, cy: 44, rx: 2.4, ry: 4.4 }, earGold);
        make('path', { d: 'M160 40 L160 18' }, awns);

        var stages = [[0, 'Sowing the seed'], [0.22, 'Sprouting'], [0.5, 'Growing strong'], [0.86, 'Ready to harvest']];
        var start = performance.now(), target = 0.1, p = 0, ready = false, gone = false, shown = '';

          warmth.setAttribute('opacity', span(v, 0.3, 1).toFixed(3));
          sun.style.transform = 'translate(0px,' + (-38 * ease(span(v, 0.05, 0.95))).toFixed(2) + 'px)';

          // Seed coat opens as the shoot breaks through.
          var open = ease(span(v, 0.04, 0.22));
          halfL.style.transform = 'translate(' + (-3 * open) + 'px,' + (1.2 * open) + 'px) rotate(' + (-30 * open) + 'deg)';
          halfR.style.transform = 'translate(' + (3 * open) + 'px,' + (1.2 * open) + 'px) rotate(' + (26 * open) + 'deg)';

          var grow = ease(span(v, 0.08, 0.8));
          stem.style.strokeDashoffset = 1 - grow;
          plant.style.transformOrigin = '160px 228px';
          plant.style.transform = 'rotate(' + (wind * 1.4 * alive).toFixed(3) + 'deg)';
          for (var j = 0; j < blades.length; j++) {
            var B = blades[j], k = ease(span(grow, B.at - 0.06, B.at + 0.16));

            B.el.style.transform = 'translate(' + B.x + 'px,' + B.y + 'px) rotate(' + rot.toFixed(2) + 'deg) scale(' + (B.side * k).toFixed(3) + ',' + k.toFixed(3) + ')';

          earGold.setAttribute('opacity', ripe.toFixed(3));
          awns.setAttribute('opacity', (head * 0.9).toFixed(3));

          for (var m = 0; m < sprouts.length; m++) {

          last = now;
          // While waiting, creep toward 90% so a slow connection still sees growth.
          var creep = 0.9 - (0.9 - 0.1) * Math.exp(-t / 5);
          var goal = ready && age > MIN ? 1 : Math.min(0.94, Math.max(target, creep));
          // Never grow faster than the minimum time allows, so the plant always has
          // its full 2.5 s to come up even when everything is already cached.
          if (goal < 1) goal = Math.min(goal, age / MIN);
          // Ease by elapsed time, not per frame, so a slow device isn't held back too.
          p += (goal - p) * (reduce ? 1 : 1 - Math.exp(-dt / (goal === 1 ? 0.18 : 0.22)));
          draw(p, t);
          if (goal === 1 && p > 0.995) return lift();
          requestAnimationFrame(tick);
        }

        function lift() {
          gone = true;
          draw(1, (performance.now() - start) / 1000);
          setTimeout(function () {
            el.classList.add('kl-out');
            document.documentElement.classList.remove('kl-lock');
            window.__klIsDone = true;
            if (performance.mark) performance.mark('kl:done');
            window.dispatchEvent(new Event('kl:done'));
            setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 1000);
          }, reduce ? 0 : 420);
        }

        draw(0, 0);
        requestAnimationFrame(tick);
      })();
    </script>
