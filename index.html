    <script>
      (function () {
        var el = document.getElementById('kl');
        if (!el) return;
        var NS = 'http://www.w3.org/2000/svg';
        var q = function (s) { return el.querySelectorAll(s); };
        var stem = q('.kl-stem')[0], roots = q('.kl-root'), plant = q('.kl-plant')[0], glow = q('.kl-glow')[0];
        var halfL = q('.kl-half-l')[0], halfR = q('.kl-half-r')[0], bar = q('.kl-bar i')[0], pct = q('.kl-pct')[0];
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Loose soil: granules of uneven size, scattered the same way every time.
        var seed = 7, rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
        var grains = q('.kl-grains')[0];
        for (var g = 0; g < 46; g++) {
          var c = document.createElementNS(NS, 'circle'), gx = 22 + rnd() * 196, gy = 239 + Math.pow(rnd(), 1.4) * 54;
          c.setAttribute('cx', gx.toFixed(1)); c.setAttribute('cy', gy.toFixed(1));
          c.setAttribute('r', (0.6 + rnd() * 1.7).toFixed(2)); c.setAttribute('opacity', (0.12 + rnd() * 0.3).toFixed(2));
          grains.appendChild(c);
        }

        // Leaves, low to high. Each is drawn pointing right from its joint; left
        // ones are mirrored. `at` is how far up the stem (0-1) the joint sits.
        var LANCE = 'M0 0 C6 -9 20 -15 34 -15 C40 -15 46 -13 51 -10 C45 -4 35 3 23 4 C13 5 5 3 0 0Z';
        var ROUND = 'M0 0 C3 -9 15 -15 25 -12 C32 -9 31 -1 23 3 C14 7 5 5 0 0Z';
        var RIB = 'M1 -0.6 C14 -6 30 -10 49 -10';
        var leaves = [
          { x: 121, y: 203, a: -18, s: .62, side: 1, shape: ROUND, at: .17, fill: 'A' },
          { x: 119, y: 204, a: -14, s: .56, side: -1, shape: ROUND, at: .17, fill: 'B' },
          { x: 120, y: 178, a: -30, s: .86, side: -1, shape: LANCE, at: .32, fill: 'B' },
          { x: 121, y: 154, a: -26, s: .96, side: 1, shape: LANCE, at: .45, fill: 'A' },
          { x: 119, y: 130, a: -38, s: .84, side: -1, shape: LANCE, at: .59, fill: 'A' },
          { x: 120, y: 108, a: -34, s: .72, side: 1, shape: LANCE, at: .72, fill: 'B' },
          { x: 120, y: 86, a: -44, s: .56, side: -1, shape: LANCE, at: .84, fill: 'A' },
          { x: 120, y: 62, a: -62, s: .34, side: 1, shape: LANCE, at: .96, fill: 'A' },
          { x: 120, y: 63, a: -56, s: .28, side: -1, shape: LANCE, at: .97, fill: 'B' },
        ];
        var host = q('.kl-leaves')[0];
        for (var i = 0; i < leaves.length; i++) {
          var L = leaves[i], grp = document.createElementNS(NS, 'g'), body = document.createElementNS(NS, 'path'), rib = document.createElementNS(NS, 'path');
          grp.setAttribute('class', 'kl-leaf');
          body.setAttribute('d', L.shape); body.setAttribute('fill', 'url(#kl-leaf' + L.fill + ')');
          rib.setAttribute('d', L.shape === ROUND ? 'M1 -0.5 C9 -5 17 -8 24 -7' : RIB);
          rib.setAttribute('fill', 'none'); rib.setAttribute('stroke', '#f5f2ea'); rib.setAttribute('stroke-opacity', '.35'); rib.setAttribute('stroke-width', '.9'); rib.setAttribute('stroke-linecap', 'round');
          grp.appendChild(body); grp.appendChild(rib); host.appendChild(grp);
          L.el = grp;
        }

        var start = performance.now(), target = 0.1, p = 0, ready = false, gone = false;
        var MIN = reduce ? 300 : 1300;
        var span = function (v, a, b) { return Math.max(0, Math.min(1, (v - a) / (b - a))); };
        var ease = function (t) { return 1 - Math.pow(1 - t, 3); };

        // The app reports milestones; it calls __klFinish once the first screen is ready.
        window.__klStage = function (v) { if (v > target) target = v; };
        // A hidden tab gets no animation frames, so skip straight to the page.
        window.__klFinish = function () { ready = true; if (document.hidden && !gone) lift(); };
        document.addEventListener('DOMContentLoaded', function () { window.__klStage(0.3); });
        // If the app never boots (blocked script, very old browser) don't trap the page.
        setTimeout(function () { ready = true; }, 15000);

        function draw(v, t) {
          var grow = ease(span(v, 0.1, 0.86));
          stem.style.strokeDashoffset = 1 - grow;
          for (var r = 0; r < roots.length; r++) roots[r].style.strokeDashoffset = 1 - ease(span(v, 0.03 + r * 0.05, 0.3 + r * 0.06));
          // Seed coat opens and falls back as the shoot rises.
          var open = ease(span(v, 0.06, 0.3));
          halfL.style.transform = 'translate(' + (-3 * open) + 'px,' + (1.5 * open) + 'px) rotate(' + (-28 * open) + 'deg)';
          halfR.style.transform = 'translate(' + (3 * open) + 'px,' + (1.5 * open) + 'px) rotate(' + (24 * open) + 'deg)';
          halfL.style.opacity = halfR.style.opacity = 1 - 0.55 * open;
          // Once grown, a breeze: the plant sways from its base, leaves flutter.
          var alive = reduce ? 0 : span(v, 0.8, 1);
          plant.style.transform = 'rotate(' + (Math.sin(t * 1.25) * 1.3 * alive) + 'deg)';
          for (var j = 0; j < leaves.length; j++) {
            var L = leaves[j], k = ease(span(grow, L.at - 0.04, L.at + 0.14));
            var unfurl = (1 - k) * 34 * L.side, flutter = Math.sin(t * 2.1 + j * 1.7) * 2.4 * alive;
            L.el.style.transform = 'translate(' + L.x + 'px,' + L.y + 'px) rotate(' + (L.a * (L.side === 1 ? 1 : -1) + unfurl + flutter) + 'deg) scale(' + (L.side * L.s * k) + ',' + (L.s * k) + ')';
          }
          glow.setAttribute('opacity', span(v, 0.55, 1).toFixed(3));
          bar.style.transform = 'scaleX(' + v + ')';
          pct.textContent = Math.round(v * 100) + '%';
        }

        var last = start;
        function tick(now) {
          if (gone) return;
          var t = (now - start) / 1000, dt = Math.min(0.1, (now - last) / 1000);
          last = now;
          // While waiting, creep toward 90% so a slow connection still sees growth.
          var creep = 0.9 - (0.9 - 0.1) * Math.exp(-t / 5);
          var goal = ready && now - start > MIN ? 1 : Math.min(0.92, Math.max(target, creep));
          // Ease by elapsed time, not per frame, so a slow device isn't held back too.
          p += (goal - p) * (reduce ? 1 : 1 - Math.exp(-dt / (goal === 1 ? 0.16 : 0.3)));
          draw(p, t);
          if (goal === 1 && p > 0.995) return lift();
          requestAnimationFrame(tick);
        }

        function lift() {
          gone = true;
          draw(1, (performance.now() - start) / 1000);
          setTimeout(function () {
            el.classList.add('kl-out');
            document.documentElement.classList.remove('kl-lock');
            window.__klIsDone = true;
            if (performance.mark) performance.mark('kl:done');
            window.dispatchEvent(new Event('kl:done'));
            setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 1000);
          }, reduce ? 0 : 380);
        }

        requestAnimationFrame(tick);
      })();
    </script>
